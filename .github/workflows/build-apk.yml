name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync web app into the Android project
        run: npx cap sync android

      - name: Check signing secrets
        env:
          P1: ${{ secrets.KEYSTORE_B64_1 }}
          P2: ${{ secrets.KEYSTORE_B64_2 }}
          P0: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KK: ${{ secrets.KEY_PASSWORD }}
        run: |
          chk() { # name value expected_len
            v="$2"; l=${#v}
            echo "::notice::$1: length=$l (expected $3), starts_MII=$([[ "$v" == MII* ]] && echo yes || echo no), has_space=$([[ "$v" == *[[:space:]]* ]] && echo yes || echo no), has_VALUE=$([[ "$v" == *VALUE* ]] && echo yes || echo no), valid_b64_chars=$([[ "$v" =~ ^[A-Za-z0-9+/=]*$ ]] && echo yes || echo no)"
          }
          chk KEYSTORE_B64_1 "$P1" 1770
          chk KEYSTORE_B64_2 "$P2" 1770
          echo "::notice::KEYSTORE_B64 (single) length=${#P0}"
          echo "::notice::KEYSTORE_PASSWORD length=${#KP} (expected 24), KEY_PASSWORD length=${#KK} (expected 24), KEY_ALIAS='${KA}'"
          echo "::notice::password_has_space=$([[ "$KP$KK" == *[[:space:]]* ]] && echo yes || echo no), passwords_equal=$([ "$KP" = "$KK" ] && echo yes || echo no)"

      - name: Build APK
        id: build
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}${{ secrets.KEYSTORE_B64_1 }}${{ secrets.KEYSTORE_B64_2 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          report() {
            # Surface the useful lines of a failed build as annotations (visible without the raw log).
            grep -E "error:|FAILED|What went wrong|Execution failed|Caused by|AAPT|Unresolved|cannot find symbol|Keystore|keystore" build.log | head -12 | cut -c1-300 | while IFS= read -r line; do echo "::error::${line}"; done
          }
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore" || { echo "::error::Keystore secret is not valid base64 (check KEYSTORE_B64_1 and _2 were pasted whole)"; exit 1; }
            if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > keytool.log 2>&1; then
              echo "::error::Signing key check failed: $(head -c 200 keytool.log | tr '\n' ' ')"; exit 1
            fi
            export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            ./gradlew assembleRelease --no-daemon > build.log 2>&1 || { report; exit 1; }
            cp app/build/outputs/apk/release/app-release.apk ../hydrate-plus.apk
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets are missing, so this build is a temporary test build and is not published as a release."
            ./gradlew assembleDebug --no-daemon > build.log 2>&1 || { report; exit 1; }
            cp app/build/outputs/apk/debug/app-debug.apk ../hydrate-plus.apk
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hydrate-plus-apk
          path: hydrate-plus.apk
          if-no-files-found: error

      - name: Publish the signed APK as a release
        if: steps.build.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" hydrate-plus.apk \
            --title "Hydrate+ 1.0.${{ github.run_number }}" \
            --notes "Download hydrate-plus.apk on your Android phone and install it over the previous version. Your data is kept." \
            --target "${{ github.sha }}"
